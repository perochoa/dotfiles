# ==============================================================================
# Prefix
# ==============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==============================================================================
# General
# ==============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true colour passthrough
set -g history-limit 50000
set -g escape-time 10                        # faster escape sequences (vim)
set -g focus-events on
set -g mouse on
set -g base-index 1                          # windows start at 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ==============================================================================
# Key bindings
# ==============================================================================
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Intuitive splits (open in current path)
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# Copy mode (vi keys)
# ==============================================================================
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# ==============================================================================
# Status bar
# ==============================================================================
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right: host | date time
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]#H  #[fg=#cdd6f4]%Y-%m-%d  %H:%M "

# Window list
set -g window-status-format         " #[fg=#6c7086]#I:#W "
set -g window-status-current-format " #[bg=#313244,fg=#89b4fa,bold]#I:#W #[bg=#1e1e2e,fg=#313244]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#313244,fg=#cdd6f4"
